<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高龄老人行走</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #fff; }
  canvas { display: block; }
</style>
</head>
<body>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>
<script type="module">
import * as THREE from 'three';

/* ================================================================
   场景初始化
   ================================================================ */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffffff);

const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 20);
camera.position.set(2.8, 0.9, 2.2);
camera.lookAt(0, 0.85, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

/* ================================================================
   光照
   ================================================================ */
// 环境光 — 柔和填充
const ambient = new THREE.AmbientLight(0xffffff, 1.6);
scene.add(ambient);

// 半球光 — 天空/地面自然过渡
const hemi = new THREE.HemisphereLight(0xddeeff, 0x8899aa, 0.8);
scene.add(hemi);

// 主方向光 (Key Light) — 从右前上方打来
const keyLight = new THREE.DirectionalLight(0xfff5ee, 4.5);
keyLight.position.set(5, 8, 3);
keyLight.castShadow = true;
keyLight.shadow.mapSize.width = 1024;
keyLight.shadow.mapSize.height = 1024;
keyLight.shadow.camera.near = 0.1;
keyLight.shadow.camera.far = 30;
keyLight.shadow.camera.left = -3;
keyLight.shadow.camera.right = 3;
keyLight.shadow.camera.top = 3;
keyLight.shadow.camera.bottom = -0.5;
keyLight.shadow.bias = -0.0003;
keyLight.shadow.normalBias = 0.02;
scene.add(keyLight);

// 补光 (Fill) — 从左侧柔和补充
const fillLight = new THREE.DirectionalLight(0xccddff, 1.2);
fillLight.position.set(-3, 2, 0);
scene.add(fillLight);

// 底部补光 — 减少下巴/腿下过暗
const rimLight = new THREE.DirectionalLight(0xffffff, 0.6);
rimLight.position.set(0, 0.2, -2);
scene.add(rimLight);

/* ================================================================
   不可见地面 (仅接收阴影, 不渲染几何体)
   ================================================================ */
const shadowPlane = new THREE.Mesh(
  new THREE.PlaneGeometry(8, 8),
  new THREE.ShadowMaterial({ opacity: 0.22 })
);
shadowPlane.rotation.x = -Math.PI / 2;
shadowPlane.position.y = -0.008;
shadowPlane.receiveShadow = true;
scene.add(shadowPlane);

/* ================================================================
   材质定义
   ================================================================ */
const matSkin = new THREE.MeshStandardMaterial({
  color: 0xf0c8a0, roughness: 0.55, metalness: 0.0,
});
const matSkinDark = new THREE.MeshStandardMaterial({
  color: 0xe0b890, roughness: 0.55, metalness: 0.0,
});
const matHair = new THREE.MeshStandardMaterial({
  color: 0xc8c8c8, roughness: 0.75, metalness: 0.0,
});
const matHairDark = new THREE.MeshStandardMaterial({
  color: 0xa8a8a8, roughness: 0.75, metalness: 0.0,
});
const matShirt = new THREE.MeshStandardMaterial({
  color: 0xf2f0eb, roughness: 0.82, metalness: 0.0,
});
const matPants = new THREE.MeshStandardMaterial({
  color: 0x3a3c40, roughness: 0.78, metalness: 0.0,
});
const matShoe = new THREE.MeshStandardMaterial({
  color: 0x1a1a1a, roughness: 0.6, metalness: 0.05,
});
const matShoeSole = new THREE.MeshStandardMaterial({
  color: 0x2a2a2a, roughness: 0.7, metalness: 0.0,
});
const matEye = new THREE.MeshStandardMaterial({
  color: 0x1a1a1a, roughness: 0.3, metalness: 0.1,
});
const matEyeWhite = new THREE.MeshStandardMaterial({
  color: 0xfafafa, roughness: 0.2, metalness: 0.0,
});

/* ================================================================
   辅助: 创建胶囊体 (CapsuleGeometry 兼容)
   ================================================================ */
function createCapsule(radius, length, material) {
  const geo = new THREE.CapsuleGeometry(radius, length, 8, 12);
  const mesh = new THREE.Mesh(geo, material);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

/* ================================================================
   角色构建
   ================================================================ */

// --- 身体根节点 ---
const bodyRoot = new THREE.Group();
bodyRoot.position.set(0, 0.865, 0); // 使脚底在 y≈0
scene.add(bodyRoot);

// --- 髋部组 (腿的父节点 + 上下起伏) ---
const hipGroup = new THREE.Group();
hipGroup.position.set(0, 0, 0);
bodyRoot.add(hipGroup);

// --- 躯干组 ---
const torsoGroup = new THREE.Group();
torsoGroup.position.set(0, 0.02, 0);
hipGroup.add(torsoGroup);

// 躯干网格 (微锥形, 下部稍宽 — 老年人腹部)
const torsoGeo = new THREE.CylinderGeometry(0.13, 0.14, 0.54, 16);
const torso = new THREE.Mesh(torsoGeo, matShirt);
torso.position.y = 0.27;
torso.castShadow = true;
torso.receiveShadow = true;
torsoGroup.add(torso);

// 衣领装饰
const collarGeo = new THREE.TorusGeometry(0.115, 0.018, 8, 16);
const collar = new THREE.Mesh(collarGeo, new THREE.MeshStandardMaterial({
  color: 0xe8e4de, roughness: 0.7, metalness: 0.0,
}));
collar.position.y = 0.54;
collar.rotation.x = Math.PI / 2;
torsoGroup.add(collar);

// --- 头部组 ---
const headGroup = new THREE.Group();
headGroup.position.set(0.01, 0.56, 0.0);
torsoGroup.add(headGroup);

// 脖子
const neckGeo = new THREE.CylinderGeometry(0.045, 0.05, 0.06, 12);
const neck = new THREE.Mesh(neckGeo, matSkinDark);
neck.position.y = -0.03;
neck.castShadow = true;
headGroup.add(neck);

// 头部主体 (略椭圆形)
const headGeo = new THREE.SphereGeometry(0.108, 24, 24);
const headMesh = new THREE.Mesh(headGeo, matSkin);
headMesh.scale.set(0.96, 1.06, 0.92);
headMesh.position.y = 0.06;
headMesh.castShadow = true;
headMesh.receiveShadow = true;
headGroup.add(headMesh);

// 白发 (头顶 + 两侧)
const hairTopGeo = new THREE.SphereGeometry(0.111, 20, 16, 0, Math.PI * 2, 0, Math.PI * 0.55);
const hairTop = new THREE.Mesh(hairTopGeo, matHair);
hairTop.scale.set(0.98, 1.02, 0.94);
hairTop.position.y = 0.07;
hairTop.castShadow = true;
headGroup.add(hairTop);

// 侧发 (两鬓斑白)
const hairSideLGeo = new THREE.SphereGeometry(0.105, 16, 12, 0, Math.PI * 2, Math.PI * 0.38, Math.PI * 0.32);
const hairSideL = new THREE.Mesh(hairSideLGeo, matHairDark);
hairSideL.position.set(-0.08, 0.02, -0.01);
hairSideL.castShadow = true;
headGroup.add(hairSideL);

const hairSideRGeo = new THREE.SphereGeometry(0.105, 16, 12, 0, Math.PI * 2, Math.PI * 0.38, Math.PI * 0.32);
const hairSideR = new THREE.Mesh(hairSideRGeo, matHairDark);
hairSideR.position.set(0.08, 0.02, -0.01);
hairSideR.castShadow = true;
headGroup.add(hairSideR);

// 耳朵
const earGeo = new THREE.SphereGeometry(0.028, 10, 8);
earGeo.scale(0.5, 0.8, 0.4);
const earL = new THREE.Mesh(earGeo, matSkinDark);
earL.position.set(-0.096, 0.055, -0.01);
earL.castShadow = true;
headGroup.add(earL);

const earR = new THREE.Mesh(earGeo.clone(), matSkinDark);
earR.position.set(0.096, 0.055, -0.01);
earR.castShadow = true;
headGroup.add(earR);

// 眼睛
const eyeWhiteGeo = new THREE.SphereGeometry(0.016, 8, 8);
const eyeWhiteL = new THREE.Mesh(eyeWhiteGeo, matEyeWhite);
eyeWhiteL.position.set(-0.032, 0.07, 0.085);
headGroup.add(eyeWhiteL);
const eyeWhiteR = new THREE.Mesh(eyeWhiteGeo.clone(), matEyeWhite);
eyeWhiteR.position.set(0.032, 0.07, 0.085);
headGroup.add(eyeWhiteR);

const eyeGeo = new THREE.SphereGeometry(0.009, 8, 8);
const eyeL = new THREE.Mesh(eyeGeo, matEye);
eyeL.position.set(-0.034, 0.07, 0.099);
headGroup.add(eyeL);
const eyeR = new THREE.Mesh(eyeGeo.clone(), matEye);
eyeR.position.set(0.03, 0.07, 0.099);
headGroup.add(eyeR);

// 鼻子
const noseGeo = new THREE.SphereGeometry(0.018, 8, 6);
noseGeo.scale(0.7, 0.7, 0.5);
const nose = new THREE.Mesh(noseGeo, matSkinDark);
nose.position.set(0, 0.045, 0.10);
nose.castShadow = true;
headGroup.add(nose);

// 嘴 (细线用扁椭球模拟)
const mouthGeo = new THREE.SphereGeometry(0.017, 8, 4);
mouthGeo.scale(0.9, 0.25, 0.3);
const mouth = new THREE.Mesh(mouthGeo, new THREE.MeshStandardMaterial({
  color: 0xb07060, roughness: 0.4, metalness: 0.0,
}));
mouth.position.set(0, 0.01, 0.098);
headGroup.add(mouth);

// --- 左腿组 (远侧) ---
const legLGroup = new THREE.Group();
legLGroup.position.set(-0.075, 0, 0);
hipGroup.add(legLGroup);

const legLUpper = new THREE.Group();
legLUpper.position.set(0, -0.02, 0.02);
legLGroup.add(legLUpper);

const thighLGeo = new THREE.CapsuleGeometry(0.075, 0.35, 6, 10);
const thighL = new THREE.Mesh(thighLGeo, matPants);
thighL.position.y = -0.22;
thighL.castShadow = true;
thighL.receiveShadow = true;
legLUpper.add(thighL);

const legLLower = new THREE.Group();
legLLower.position.set(0, -0.43, 0);
legLUpper.add(legLLower);

const shinLGeo = new THREE.CapsuleGeometry(0.065, 0.32, 6, 10);
const shinL = new THREE.Mesh(shinLGeo, matPants);
shinL.position.y = -0.19;
shinL.castShadow = true;
shinL.receiveShadow = true;
legLLower.add(shinL);

// 左脚 (远侧)
const footL = new THREE.Group();
footL.position.set(0, -0.37, 0.03);
legLLower.add(footL);

const shoeLGeo = new THREE.BoxGeometry(0.09, 0.05, 0.18);
const shoeL = new THREE.Mesh(shoeLGeo, matShoe);
shoeL.position.set(0.03, -0.01, 0.04);
shoeL.castShadow = true;
shoeL.receiveShadow = true;
footL.add(shoeL);

const soleLGeo = new THREE.BoxGeometry(0.085, 0.012, 0.17);
const soleL = new THREE.Mesh(soleLGeo, matShoeSole);
soleL.position.set(0.03, -0.038, 0.04);
footL.add(soleL);

// --- 右腿组 (近侧) ---
const legRGroup = new THREE.Group();
legRGroup.position.set(0.075, 0, 0);
hipGroup.add(legRGroup);

const legRUpper = new THREE.Group();
legRUpper.position.set(0, -0.02, -0.02);
legRGroup.add(legRUpper);

const thighRGeo = new THREE.CapsuleGeometry(0.078, 0.35, 6, 10);
const thighR = new THREE.Mesh(thighRGeo, matPants);
thighR.position.y = -0.22;
thighR.castShadow = true;
thighR.receiveShadow = true;
legRUpper.add(thighR);

const legRLower = new THREE.Group();
legRLower.position.set(0, -0.43, 0);
legRUpper.add(legRLower);

const shinRGeo = new THREE.CapsuleGeometry(0.068, 0.32, 6, 10);
const shinR = new THREE.Mesh(shinRGeo, matPants);
shinR.position.y = -0.19;
shinR.castShadow = true;
shinR.receiveShadow = true;
legRLower.add(shinR);

// 右脚 (近侧)
const footR = new THREE.Group();
footR.position.set(0, -0.37, -0.03);
legRLower.add(footR);

const shoeRGeo = new THREE.BoxGeometry(0.09, 0.05, 0.18);
const shoeR = new THREE.Mesh(shoeRGeo, matShoe);
shoeR.position.set(0.03, -0.01, 0.04);
shoeR.castShadow = true;
shoeR.receiveShadow = true;
footR.add(shoeR);

const soleRGeo = new THREE.BoxGeometry(0.085, 0.012, 0.17);
const soleR = new THREE.Mesh(soleRGeo, matShoeSole);
soleR.position.set(0.03, -0.038, 0.04);
footR.add(soleR);

// --- 左臂组 (远侧) ---
const armLGroup = new THREE.Group();
armLGroup.position.set(-0.14, 0.48, 0.03);
torsoGroup.add(armLGroup);

const armLUpper = new THREE.Group();
armLUpper.position.set(0, 0, 0);
armLGroup.add(armLUpper);

const upperArmLGeo = new THREE.CapsuleGeometry(0.042, 0.22, 6, 8);
const upperArmL = new THREE.Mesh(upperArmLGeo, matSkin);
upperArmL.position.y = -0.16;
upperArmL.castShadow = true;
armLUpper.add(upperArmL);

// 短袖袖口
const sleeveLGeo = new THREE.TorusGeometry(0.046, 0.012, 6, 12);
const sleeveL = new THREE.Mesh(sleeveLGeo, matShirt);
sleeveL.position.y = -0.04;
sleeveL.rotation.x = Math.PI / 2;
armLUpper.add(sleeveL);

const armLLower = new THREE.Group();
armLLower.position.set(0, -0.27, 0);
armLUpper.add(armLLower);

const lowerArmLGeo = new THREE.CapsuleGeometry(0.036, 0.2, 6, 8);
const lowerArmL = new THREE.Mesh(lowerArmLGeo, matSkin);
lowerArmL.position.y = -0.14;
lowerArmL.castShadow = true;
armLLower.add(lowerArmL);

// 左手
const handLGeo = new THREE.SphereGeometry(0.036, 10, 8);
handLGeo.scale(0.7, 0.8, 0.5);
const handL = new THREE.Mesh(handLGeo, matSkin);
handL.position.y = -0.26;
handL.castShadow = true;
armLLower.add(handL);

// --- 右臂组 (近侧) ---
const armRGroup = new THREE.Group();
armRGroup.position.set(0.14, 0.48, -0.03);
torsoGroup.add(armRGroup);

const armRUpper = new THREE.Group();
armRUpper.position.set(0, 0, 0);
armRGroup.add(armRUpper);

const upperArmRGeo = new THREE.CapsuleGeometry(0.044, 0.22, 6, 8);
const upperArmR = new THREE.Mesh(upperArmRGeo, matSkin);
upperArmR.position.y = -0.16;
upperArmR.castShadow = true;
armRUpper.add(upperArmR);

const sleeveRGeo = new THREE.TorusGeometry(0.048, 0.012, 6, 12);
const sleeveR = new THREE.Mesh(sleeveRGeo, matShirt);
sleeveR.position.y = -0.04;
sleeveR.rotation.x = Math.PI / 2;
armRUpper.add(sleeveR);

const armRLower = new THREE.Group();
armRLower.position.set(0, -0.27, 0);
armRUpper.add(armRLower);

const lowerArmRGeo = new THREE.CapsuleGeometry(0.038, 0.2, 6, 8);
const lowerArmR = new THREE.Mesh(lowerArmRGeo, matSkin);
lowerArmR.position.y = -0.14;
lowerArmR.castShadow = true;
armRLower.add(lowerArmR);

const handRGeo = new THREE.SphereGeometry(0.038, 10, 8);
handRGeo.scale(0.7, 0.8, 0.5);
const handR = new THREE.Mesh(handRGeo, matSkin);
handR.position.y = -0.26;
handR.castShadow = true;
armRLower.add(handR);

/* ================================================================
   步态参数 (70岁老年男性)
   ================================================================ */
const CYCLE_MS = 2200;
const HIP_MAX      = 13.5 * Math.PI / 180;
const KNEE_SWING   = 28   * Math.PI / 180;
const KNEE_STANCE  = 2.2  * Math.PI / 180;
const SHOULDER_MAX = 8.5  * Math.PI / 180;
const ELBOW_SWING  = 7    * Math.PI / 180;
const TORSO_LEAN   = 5.5  * Math.PI / 180;
const TORSO_SWAY   = 2.2  * Math.PI / 180;
const TORSO_TWIST  = 3    * Math.PI / 180;
const BODY_LIFT    = 0.022;
const BODY_SHIFT   = 0.008;
const HEAD_STAB    = 0.45;

let speedMul = 1.0;

function kneeAngle(phase) {
  const s = Math.sin(phase);
  return Math.max(0, -s) * KNEE_SWING + Math.max(0, s) * KNEE_STANCE;
}

function elbowAngle(phase) {
  return Math.max(0, Math.sin(phase)) * ELBOW_SWING;
}

/* ================================================================
   响应式处理
   ================================================================ */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ================================================================
   键盘控制
   ================================================================ */
window.addEventListener('keydown', (e) => {
  switch (e.key.toLowerCase()) {
    case 'arrowleft':  speedMul = Math.max(0.3,  speedMul - 0.1); break;
    case 'arrowright': speedMul = Math.min(3.0,  speedMul + 0.1); break;
    case 'r':          speedMul = 1.0; break;
  }
});

/* ================================================================
   主循环 — 角色面向 +Z 轴, 行走在 YZ 矢状面
   肢体 swing: rotation.x  |  躯干 lean/sway/twist: x/z/y
   ================================================================ */
function animate(timestamp) {
  requestAnimationFrame(animate);

  const cycle = CYCLE_MS / speedMul;
  const phase = ((timestamp % cycle) / cycle) * Math.PI * 2;
  const s = Math.sin(phase);
  const c = Math.cos(phase);

  const hipR = HIP_MAX * s;
  const hipL = HIP_MAX * Math.sin(phase + Math.PI);
  const kneeR = kneeAngle(phase);
  const kneeL = kneeAngle(phase + Math.PI);
  const shoulderR = SHOULDER_MAX * Math.sin(phase + Math.PI);
  const shoulderL = SHOULDER_MAX * s;
  const elbowR = elbowAngle(phase + Math.PI);
  const elbowL = elbowAngle(phase);
  const torsoLean = TORSO_LEAN + 1.2 * Math.PI / 180 * Math.abs(c);
  const torsoSway = TORSO_SWAY * c;
  const torsoTwist = TORSO_TWIST * s;
  const lift = BODY_LIFT * Math.abs(s);
  const shift = BODY_SHIFT * s;
  const headComp = -torsoSway * HEAD_STAB;

  hipGroup.position.y = lift;
  hipGroup.position.x = shift;

  torsoGroup.rotation.x = torsoLean;
  torsoGroup.rotation.z = torsoSway;
  torsoGroup.rotation.y = torsoTwist;

  headGroup.rotation.z = headComp;
  headGroup.rotation.x = -torsoLean * 0.3;

  legRUpper.rotation.x = hipR;
  legRLower.rotation.x = -kneeR;
  legLUpper.rotation.x = hipL;
  legLLower.rotation.x = -kneeL;
  armRUpper.rotation.x = shoulderR;
  armRLower.rotation.x = -elbowR;
  armLUpper.rotation.x = shoulderL;
  armLLower.rotation.x = -elbowL;

  renderer.render(scene, camera);
}

requestAnimationFrame(animate);

console.log('%c高龄老人行走动画已就绪 %c| %c← → 调速 %c| %cR 重置',
  'color:#333;font-size:14px', '', 'color:#666', '', 'color:#666');
</script>
</body>
</html>
