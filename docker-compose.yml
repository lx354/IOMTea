services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: iomtea
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d iomtea"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-i", "healthcheck-$$", "-W", "3"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - mosquitto-data:/mosquitto/data
    ports:
      - "${MQTT_PORT:-1883}:1883"
    restart: unless-stopped

  server:
    image: ghcr.io/${IMAGE_REPO}/server:${IMAGE_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-postgres}@postgres:5432/iomtea
      JWT_SECRET: "${JWT_SECRET:-dev-secret-change-in-production}"
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-2h}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      PORT: "3000"
      MQTT_ENABLED: "${MQTT_ENABLED:-false}"
      MQTT_BROKER: "mqtt://mosquitto:1883"
      TCP_INGEST_PORT: "5858"
      TCP_INGEST_TOKEN: "${TCP_INGEST_TOKEN:-}"
      SUPER_ADMIN_USERNAME: "${SUPER_ADMIN_USERNAME:-admin}"
      SUPER_ADMIN_PASSWORD: "${SUPER_ADMIN_PASSWORD:-admin123}"
      CORS_ORIGIN: "${CORS_ORIGIN:-http://localhost:5173}"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      - "${SERVER_PORT:-3000}:3000"
      - "${GATEWAY_PORT:-5858}:5858"
    restart: unless-stopped

  web:
    image: ghcr.io/${IMAGE_REPO}/web:${IMAGE_TAG:-latest}
    depends_on:
      - server
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    restart: unless-stopped

volumes:
  pgdata:
  mosquitto-data:
