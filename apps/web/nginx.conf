server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name iomt.205716.xyz;

    ssl_certificate /etc/letsencrypt/live/iomt.205716.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iomt.205716.xyz/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    location ~ ^/(auth|users|patients|alerts|alert-rules|dashboard|pins|tags|data|export|ingest|twin|plans|credits|forms|health|docs|openapi\.json)($|/) {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
