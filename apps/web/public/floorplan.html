<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>居家环境 — 认知障碍老人监测系统</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--bg-deep:#0a0e14;--bg-panel:#111922;--bg-card:#161f2c;--border:rgba(255,255,255,.06);--text:#c8d6e5;--text-dim:#5a6a7e;--accent:#45aaf2;--accent-glow:rgba(69,170,242,.25);--warn:#fc5c65;--success:#20bf6b;--gold:#b8963e;--teal:#2bcbba;--orange:#fd9644}
  body{background:var(--bg-deep);font-family:'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif;color:var(--text);min-height:100vh;overflow-x:hidden}
  .bg-particles{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}
  .app{position:relative;z-index:1;display:grid;grid-template-columns:320px 1fr;grid-template-rows:auto 1fr;gap:14px;padding:16px 20px 20px;max-width:1400px;margin:0 auto;min-height:100vh}
  .topbar{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;background:var(--bg-panel);border-radius:14px;padding:12px 24px;border:1px solid var(--border);box-shadow:0 4px 20px rgba(0,0,0,.4)}
  .topbar-brand{display:flex;align-items:center;gap:12px}
  .topbar-brand .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--teal));display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff}
  .topbar-brand h1{font-size:17px;font-weight:600;letter-spacing:1.5px;background:linear-gradient(135deg,#a0c4ff,#48dbfb);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
  .topbar-meta{display:flex;align-items:center;gap:20px;font-size:13px;color:var(--text-dim)}
  .topbar-meta .live{display:flex;align-items:center;gap:6px}
  .topbar-meta .live-dot{width:9px;height:9px;border-radius:50%;background:var(--success);box-shadow:0 0 10px var(--success);animation:glow-dot 2s ease-in-out infinite}
  @keyframes glow-dot{0%,100%{box-shadow:0 0 6px var(--success)}50%{box-shadow:0 0 16px var(--success)}}
  .btn-heatmap{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:var(--bg-card);color:var(--text-dim);font-size:12px;cursor:pointer;letter-spacing:1px;transition:.25s}
  .btn-heatmap:hover{border-color:rgba(184,150,62,.4);color:var(--gold)}
  .btn-heatmap.active{background:rgba(184,150,62,.12);border-color:var(--gold);color:var(--gold)}
  .clock{font-variant-numeric:tabular-nums;font-size:14px;color:#8395a7}
  .sidebar{display:flex;flex-direction:column;gap:14px}
  .panel{background:var(--bg-panel);border-radius:14px;padding:18px;border:1px solid var(--border);box-shadow:0 4px 20px rgba(0,0,0,.35);position:relative;overflow:hidden}
  .panel::after{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent)}
  .panel-title{font-size:12px;text-transform:uppercase;letter-spacing:2px;color:var(--text-dim);margin-bottom:14px;font-weight:600}
  .elder-card{text-align:center}
  .elder-avatar{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,#45aaf2,#2d98da);margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-size:30px;color:#fff;box-shadow:0 0 24px var(--accent-glow);position:relative}
  .elder-avatar .badge{position:absolute;bottom:-2px;right:-2px;width:20px;height:20px;border-radius:50%;background:var(--success);border:2px solid var(--bg-panel)}
  .elder-name{font-size:18px;font-weight:700;color:#dfe6e9}.elder-sub{font-size:12px;color:var(--text-dim);margin-top:2px}
  .risk-ring-wrap{display:flex;justify-content:center;margin:14px 0 10px}
  .risk-ring{width:80px;height:80px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative}
  .risk-ring::after{content:'';width:62px;height:62px;border-radius:50%;background:var(--bg-panel);position:absolute}
  .risk-level{position:relative;z-index:1;font-size:14px;font-weight:700}
  .vitals-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
  .vital-item{background:var(--bg-card);border-radius:10px;padding:10px;text-align:center;border:1px solid var(--border)}
  .vital-value{font-size:20px;font-weight:700;color:#dfe6e9;font-variant-numeric:tabular-nums}
  .vital-value.normal{color:var(--teal)}.vital-value.warn{color:var(--warn)}.vital-value.attn{color:var(--gold)}
  .vital-label{font-size:10px;color:var(--text-dim);margin-top:3px}.vital-unit{font-size:11px;color:var(--text-dim);font-weight:400}
  .dims{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:10px}
  .dim-item{display:flex;align-items:center;gap:6px;font-size:11px;padding:4px 8px;border-radius:6px;background:var(--bg-card)}
  .dim-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
  .dim-dot.good{background:var(--teal)}.dim-dot.warn{background:var(--warn)}.dim-dot.attn{background:var(--gold)}
  .dim-label{color:#8395a7;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dim-val{font-weight:600;color:#b2bec3;font-variant-numeric:tabular-nums}
  .timeline{display:flex;flex-direction:column;gap:8px}
  .timeline-item{display:flex;align-items:center;gap:10px;font-size:12px;padding:8px 10px;border-radius:8px;background:var(--bg-card);border-left:3px solid transparent}
  .timeline-item.current{border-left-color:var(--accent);background:rgba(69,170,242,.06)}
  .tl-time{color:var(--text-dim);font-variant-numeric:tabular-nums;white-space:nowrap;min-width:44px}
  .tl-room{color:#b2bec3;font-weight:600}.tl-dur{color:var(--text-dim);margin-left:auto}
  .tl-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex-shrink:0}
  .summary-section{margin-top:12px}.summary-section:first-child{margin-top:0}
  .summary-label{font-size:11px;color:var(--text-dim);margin-bottom:8px;font-weight:600;letter-spacing:1px}
  .summary-bar-wrap{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .summary-bar-tag{font-size:11px;color:#8395a7;min-width:28px;text-align:center}
  .summary-bar-track{flex:1;height:8px;border-radius:4px;background:var(--bg-card);overflow:hidden}
  .summary-bar-fill{height:100%;border-radius:4px;transition:width .5s}
  .summary-bar-fill.walk{background:var(--teal)}.summary-bar-fill.sit{background:var(--gold)}.summary-bar-fill.lie{background:#a55eea}
  .summary-bar-fill.room{background:var(--accent)}
  .summary-bar-val{font-size:11px;color:#b2bec3;font-weight:600;min-width:48px;text-align:right;font-variant-numeric:tabular-nums}
  .summary-divider{border:none;border-top:1px solid var(--border);margin:10px 0}
  .main-area{display:flex;flex-direction:column;gap:14px}
  .floorplan-wrap{flex:1;display:flex;align-items:center;justify-content:center}
  .floorplan-card{background:var(--bg-panel);border-radius:14px;padding:16px;border:1px solid var(--border);box-shadow:0 4px 24px rgba(0,0,0,.45);position:relative;overflow:hidden}
  .floorplan-card::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle at 30% 20%,rgba(69,170,242,.04) 0%,transparent 55%),radial-gradient(circle at 70% 80%,rgba(252,92,101,.03) 0%,transparent 55%);pointer-events:none}
  svg.floorplan{display:block;border-radius:8px;position:relative;z-index:1}
  .room-label{font-size:16px;font-weight:700;letter-spacing:2px;pointer-events:none;fill:#4a3028}
  .clickable-room{cursor:pointer;transition:filter .2s}.clickable-room:hover{filter:brightness(1.05)}
  .door-line{stroke:#b8963e;stroke-width:2.2;stroke-linecap:round}
  .door-arc{stroke:rgba(184,150,62,.3);stroke-width:1.2;stroke-dasharray:3 4;fill:none}
  .window-line{stroke:var(--accent);stroke-width:2.5;stroke-linecap:round}
  .window-glow{stroke:rgba(69,170,242,.15);stroke-width:7;stroke-linecap:round}
  .elder-group{cursor:pointer}.elder-group:hover .elder-glow-el{opacity:1}
  @keyframes pulse-sensor{0%,100%{opacity:.5;r:3.5}50%{opacity:1;r:5.5}}.sensor-dot{animation:pulse-sensor 2s ease-in-out infinite}
  @keyframes steam{0%{opacity:0;transform:translateY(0)}30%{opacity:.4}100%{opacity:0;transform:translateY(-14px)}}.steam{animation:steam 2.5s ease-out infinite}
  .hm-overlay{transition:opacity .5s}
  .hm-legend-bar{width:16px;height:8px;border-radius:2px}
  .toast{position:fixed;top:24px;left:50%;transform:translateX(-50%);background:var(--bg-card);color:#fff;padding:10px 28px;border-radius:30px;font-size:14px;letter-spacing:1px;border:1px solid var(--border);box-shadow:0 8px 30px rgba(0,0,0,.5);opacity:0;pointer-events:none;z-index:999;transition:opacity .3s,transform .3s}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(8px)}
  .bottom-panels{display:flex;gap:14px;margin-top:14px}
  .bottom-panels .dims{grid-template-columns:1fr 1fr 1fr}
  .status-strip{display:flex;gap:14px;align-items:center;background:var(--bg-panel);border-radius:12px;padding:12px 20px;border:1px solid var(--border);box-shadow:0 4px 20px rgba(0,0,0,.3);font-size:13px}
  .status-strip .label{color:var(--text-dim)}.status-strip .value{color:#dfe6e9;font-weight:600}.status-strip .value.highlight{color:var(--accent)}
  .status-strip .sep{width:1px;height:16px;background:var(--border)}
  @media(max-width:1200px){.app{grid-template-columns:1fr}.sidebar{order:2}.main-area{order:1}}
</style>
</head>
<body>
<canvas class="bg-particles" id="particles"></canvas>
<div class="toast" id="toast"></div>

<div class="app">
  <div class="topbar">
    <div class="topbar-brand"><div class="logo">⌂</div><h1>居家环境</h1></div>
    <div class="topbar-meta">
      <button class="btn-heatmap" id="btn-heatmap" onclick="toggleHeatmap()">热力图</button>
      <span class="live"><span class="live-dot"></span>实时监测中</span><span>传感器 7/7 在线</span><span id="clock" class="clock"></span>
    </div>
  </div>

  <div class="sidebar">
    <div class="panel elder-card">
      <div class="panel-title">监测对象</div>
      <div class="elder-avatar">👴<div class="badge"></div></div>
      <div class="elder-name">张建国</div><div class="elder-sub">男 · 78 岁 · 轻度认知障碍</div>
      <div class="risk-ring-wrap"><div class="risk-ring" id="risk-ring"><span class="risk-level" id="risk-level" style="color:#20bf6b">稳定</span></div></div>
      <div class="vitals-grid">
        <div class="vital-item"><div class="vital-value normal" id="vital-hr">72</div><div class="vital-label">心率 <span class="vital-unit">bpm</span></div></div>
        <div class="vital-item"><div class="vital-value normal" id="vital-spo2">97</div><div class="vital-label">血氧 <span class="vital-unit">%</span></div></div>
        <div class="vital-item"><div class="vital-value normal" id="vital-bp">128/82</div><div class="vital-label">血压 <span class="vital-unit">mmHg</span></div></div>
        <div class="vital-item"><div class="vital-value normal" id="vital-temp">36.5</div><div class="vital-label">体温 <span class="vital-unit">°C</span></div></div>
      </div>
      <div style="margin-top:10px;display:flex;gap:8px;font-size:11px;justify-content:center;color:var(--text-dim)">
        <span>步数 <b style="color:#dfe6e9">3,247</b></span><span>|</span><span>久坐 <b style="color:var(--gold)">2.1h</b></span><span>|</span><span id="elder-room-dur">停留 8min</span>
      </div>
    </div>

    <div class="panel" id="daily-summary-panel">
      <div class="panel-title">每日总结 (今日)</div>
      <div class="summary-section">
        <div class="summary-label">活动分布</div>
        <div class="summary-bar-wrap"><span class="summary-bar-tag">行走</span><div class="summary-bar-track"><div class="summary-bar-fill walk" id="bar-walk" style="width:18%"></div></div><span class="summary-bar-val" id="val-walk">1.5 h</span></div>
        <div class="summary-bar-wrap"><span class="summary-bar-tag">坐</span><div class="summary-bar-track"><div class="summary-bar-fill sit" id="bar-sit" style="width:45%"></div></div><span class="summary-bar-val" id="val-sit">3.8 h</span></div>
        <div class="summary-bar-wrap"><span class="summary-bar-tag">躺</span><div class="summary-bar-track"><div class="summary-bar-fill lie" id="bar-lie" style="width:85%"></div></div><span class="summary-bar-val" id="val-lie">7.0 h</span></div>
      </div>
      <hr class="summary-divider">
      <div class="summary-section">
        <div class="summary-label">各房间时长</div>
        <div class="summary-bar-wrap"><span class="summary-bar-tag">客厅</span><div class="summary-bar-track"><div class="summary-bar-fill room" id="bar-living" style="width:40%"></div></div><span class="summary-bar-val" id="val-living">2.4 h</span></div>
        <div class="summary-bar-wrap"><span class="summary-bar-tag">卧室</span><div class="summary-bar-track"><div class="summary-bar-fill room" id="bar-bedroom" style="width:92%"></div></div><span class="summary-bar-val" id="val-bedroom">7.8 h</span></div>
        <div class="summary-bar-wrap"><span class="summary-bar-tag">厨房</span><div class="summary-bar-track"><div class="summary-bar-fill room" id="bar-kitchen" style="width:22%"></div></div><span class="summary-bar-val" id="val-kitchen">1.3 h</span></div>
        <div class="summary-bar-wrap"><span class="summary-bar-tag">餐厅</span><div class="summary-bar-track"><div class="summary-bar-fill room" id="bar-dining" style="width:15%"></div></div><span class="summary-bar-val" id="val-dining">0.9 h</span></div>
        <div class="summary-bar-wrap"><span class="summary-bar-tag">卫生间</span><div class="summary-bar-track"><div class="summary-bar-fill room" id="bar-bathroom" style="width:6%"></div></div><span class="summary-bar-val" id="val-bathroom">0.3 h</span></div>
      </div>
      <div style="margin-top:8px;display:flex;align-items:center;gap:6px;font-size:10px;color:var(--text-dim)">
        <span>低</span><div class="hm-legend-bar" style="background:rgba(69,170,242,.15)"></div><div class="hm-legend-bar" style="background:rgba(69,170,242,.3)"></div><div class="hm-legend-bar" style="background:rgba(69,170,242,.5)"></div><div class="hm-legend-bar" style="background:rgba(69,170,242,.7)"></div><span>高</span>
        <span style="margin-left:auto">点击"热力图"查看</span>
      </div>
    </div>
  </div>

  <div class="main-area">
    <div class="floorplan-wrap">
      <div class="floorplan-card">
<svg class="floorplan" width="940" height="650" viewBox="0 0 940 650" xmlns="http://www.w3.org/2000/svg">
<defs>
  <!-- 真实光影 -->
  <filter id="shadowFloor" x="-10%" y="-10%" width="130%" height="140%"><feGaussianBlur in="SourceAlpha" stdDeviation="2" result="b"/><feOffset dx="0" dy="2" in="b" result="o"/><feComponentTransfer in="o"><feFuncA type="linear" slope="0.35"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="shadowWall" x="-10%" y="-10%" width="130%" height="140%"><feGaussianBlur in="SourceAlpha" stdDeviation="3" result="b"/><feOffset dx="0" dy="3" in="b" result="o"/><feComponentTransfer in="o"><feFuncA type="linear" slope="0.45"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="shadowBed" x="-10%" y="-10%" width="130%" height="130%"><feGaussianBlur in="SourceAlpha" stdDeviation="3" result="b"/><feOffset dx="-1" dy="2" in="b" result="o"/><feComponentTransfer in="o"><feFuncA type="linear" slope="0.4"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>

  <!-- 木地板质感 - 人字拼 -->
  <linearGradient id="woodPlank" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#c8a87c"/><stop offset="15%" stop-color="#c4a070"/><stop offset="50%" stop-color="#bf9a68"/><stop offset="85%" stop-color="#ba9460"/><stop offset="100%" stop-color="#b48c58"/></linearGradient>
  <pattern id="herringbone" width="48" height="24" patternUnits="userSpaceOnUse">
    <rect width="24" height="12" fill="url(#woodPlank)"/><rect x="24" y="12" width="24" height="12" fill="url(#woodPlank)"/>
    <rect x="24" y="0" width="24" height="12" fill="#b89460"/><rect x="0" y="12" width="24" height="12" fill="#b89460"/>
    <line x1="0" y1="11.5" x2="24" y2="11.5" stroke="#a08050" stroke-width="0.4"/><line x1="24" y1="23.5" x2="48" y2="23.5" stroke="#a08050" stroke-width="0.4"/>
    <line x1="0" y1="12" x2="12" y2="12" stroke="#a08050" stroke-width="0.3"/><line x1="24" y1="0" x2="36" y2="0" stroke="#a08050" stroke-width="0.3"/>
  </pattern>

  <!-- 石材瓷砖 -->
  <linearGradient id="stoneTile" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#eae5dd"/><stop offset="40%" stop-color="#e5dfd6"/><stop offset="100%" stop-color="#dcd5c8"/></linearGradient>
  <pattern id="stoneFloor" width="32" height="32" patternUnits="userSpaceOnUse">
    <rect width="32" height="32" fill="url(#stoneTile)"/>
    <rect x="0" y="0" width="16" height="16" fill="#e0d8c8" opacity="0.35"/><rect x="16" y="16" width="16" height="16" fill="#e0d8c8" opacity="0.35"/>
    <line x1="16" y1="0" x2="16" y2="32" stroke="#d0c8b8" stroke-width="0.4"/><line x1="0" y1="16" x2="32" y2="16" stroke="#d0c8b8" stroke-width="0.4"/>
  </pattern>

  <!-- 大理石 -->
  <linearGradient id="marbleBase" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#e8e4e0"/><stop offset="50%" stop-color="#e0dcd8"/><stop offset="100%" stop-color="#d8d4d0"/></linearGradient>
  <pattern id="marble" width="36" height="36" patternUnits="userSpaceOnUse">
    <rect width="36" height="36" fill="url(#marbleBase)"/>
    <path d="M4,10 Q12,6 20,12 Q28,18 32,10" fill="none" stroke="#ccc8c4" stroke-width="0.5"/><path d="M2,24 Q14,20 24,26" fill="none" stroke="#c4c0bc" stroke-width="0.4"/>
    <path d="M10,30 Q18,26 28,32" fill="none" stroke="#d0ccc8" stroke-width="0.3"/><path d="M18,4 Q22,8 26,4" fill="none" stroke="#ccc8c4" stroke-width="0.3"/>
  </pattern>

  <!-- 卧室木地板 -->
  <linearGradient id="woodPlank2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#d4b896"/><stop offset="50%" stop-color="#cbaa84"/><stop offset="100%" stop-color="#c2a070"/></linearGradient>
  <pattern id="widePlank" width="40" height="14" patternUnits="userSpaceOnUse">
    <rect width="40" height="14" fill="url(#woodPlank2)"/><line x1="0" y1="6.5" x2="40" y2="6.5" stroke="#b89064" stroke-width="0.3"/>
    <line x1="0" y1="13.5" x2="40" y2="13.5" stroke="#a07848" stroke-width="0.5"/>
  </pattern>

  <!-- 墙面渐变 -->
  <linearGradient id="wallOuter" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#2c3e50"/><stop offset="100%" stop-color="#1a252f"/></linearGradient>
  <linearGradient id="livingWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f7f3ec"/><stop offset="100%" stop-color="#ece3d4"/></linearGradient>
  <linearGradient id="bedroomWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f0ecf6"/><stop offset="100%" stop-color="#ddd4eb"/></linearGradient>
  <linearGradient id="bathWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ebebeb"/><stop offset="100%" stop-color="#dfdfdf"/></linearGradient>
  <linearGradient id="kitchenWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f5f6f2"/><stop offset="100%" stop-color="#e8ece3"/></linearGradient>
  <linearGradient id="hallWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#eee4d5"/><stop offset="100%" stop-color="#e0d4c0"/></linearGradient>

  <!-- 3D体积渐变 -->
  <linearGradient id="surfaceTop" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fff" stop-opacity="0.25"/><stop offset="100%" stop-color="#000" stop-opacity="0.08"/></linearGradient>
  <linearGradient id="surfaceSide" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity="0.3"/></linearGradient>
  <linearGradient id="lightTop" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fff" stop-opacity="0.3"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></linearGradient>
</defs>

<!-- 外墙 -->
<rect x="14" y="14" width="912" height="622" rx="6" fill="url(#wallOuter)"/>
<rect x="20" y="20" width="900" height="610" rx="3" fill="#2a323a"/>

<!-- ============ 客厅 ============ -->
<g id="room-living">

let cr='客厅',tx,ty,cx,cy,af,hm=false

function init(){const t=elderG.transform.baseVal;if(t.length>0){cx=t.getItem(0).matrix.e;cy=t.getItem(0).matrix.f}else{cx=roomData['客厅'].x;cy=roomData['客厅'].y}tx=cx;ty=cy;rd(dims);rt();up(roomData['客厅']);hr('客厅');rds();sc()}

function rt(){const i=[{t:'10:25',r:'厨房',d:'45min',c:cr==='厨房'},{t:'10:10',r:'客厅',d:'15min',c:cr==='客厅'},{t:'08:30',r:'餐厅',d:'25min',c:cr==='餐厅'},{t:'08:00',r:'卧室',d:'30min',c:cr==='卧室'},{t:'22:00',r:'卧室',d:'10h',c:false}];document.getElementById('timeline').innerHTML=i.map(i=>`<div class="timeline-item${i.c?' current':''}"><span class="tl-dot"></span><span class="tl-time">${i.t}</span><span class="tl-room">${i.r}</span><span class="tl-dur">${i.d}</span></div>`).join('')}

function toggleHeatmap(){hm=!hm;document.getElementById('heatmap-overlays').setAttribute('opacity',hm?'1':'0');document.querySelectorAll('.room-bg').forEach(r=>r.style.opacity=hm?'0':'');const b=document.getElementById('btn-heatmap');b.classList.toggle('active',hm);b.textContent=hm?'热力图 ✓':'热力图';st(hm?'热力图已开启 — 颜色越深停留越久':'热力图已关闭')}
function hr(room){Object.values(roomData).forEach(r=>{const e=document.getElementById(r.hl);if(e)e.setAttribute('opacity','0')});const h=document.getElementById(roomData[room].hl);if(h){h.setAttribute('opacity','1');setTimeout(()=>h.setAttribute('opacity','0'),2500)}}
function clickRoom(room,x,y){cr=room;me(x,y);const d=roomData[room];up(d);hr(room);rt();st(`📍 ${room} — ${d.status}`);ds.rooms[room==='客厅'?'living':room==='餐厅'?'dining':room==='卧室'?'bedroom':room==='卫生间'?'bathroom':'kitchen']+=.05;rds()}
function me(x,y){tx=x;ty=y;if(!af)as()}
function as(){const t=elderG.transform.baseVal;if(t.length===0){elderG.setAttribute('transform',`translate(${tx},${ty})`);af=null;return}cx=t.getItem(0).matrix.e;cy=t.getItem(0).matrix.f;const dx=tx-cx,dy=ty-cy,dist=Math.sqrt(dx*dx+dy*dy);if(dist<1){elderG.setAttribute('transform',`translate(${tx},${ty})`);af=null;return}const s=7;elderG.setAttribute('transform',`translate(${cx+dx/dist*Math.min(s,dist)},${cy+dy/dist*Math.min(s,dist)})`);af=requestAnimationFrame(as)}
function st(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2000)}
function sc(){const e=document.getElementById('clock');const t=()=>{e.textContent=new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',second:'2-digit'})};t();setInterval(t,1000)}
function ip(){const c=document.getElementById('particles'),ctx=c.getContext('2d');const rs=()=>{c.width=window.innerWidth;c.height=window.innerHeight};rs();window.addEventListener('resize',rs);const pts=Array.from({length:60},()=>({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*1.5+.5,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3,o:Math.random()*.4+.1}));function dr(){ctx.clearRect(0,0,c.width,c.height);pts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0)p.x=c.width;if(p.x>c.width)p.x=0;if(p.y<0)p.y=c.height;if(p.y>c.height)p.y=0;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=`rgba(69,170,242,${p.o})`;ctx.fill()});requestAnimationFrame(dr)}dr()}
const elderG=document.getElementById('elder-group');init();ip()
