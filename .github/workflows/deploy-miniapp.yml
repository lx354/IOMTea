name: Deploy Miniapp

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Build environment'
        type: choice
        default: 'production'
        options:
          - production
          - staging

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @iomtea/miniapp...

      - name: Build miniapp
        run: |
          cd apps/miniapp
          pnpm build:weapp
        env:
          NODE_ENV: ${{ inputs.environment }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: miniapp-dist-${{ inputs.environment }}-${{ github.run_id }}
          path: apps/miniapp/dist/
          retention-days: 30
